[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deploydock-backend"
version = "0.1.0"
description = "DeployDock FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "asyncssh>=2.14.0",
  "asyncpg>=0.29.0",
  "cryptography>=42.0.0",
  "fastapi>=0.111.0",
  "pydantic-settings>=2.2.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
