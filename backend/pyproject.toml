[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deploydock-backend"
version = "0.1.0"
description = "DeployDock FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "argon2-cffi>=23.1.0",
  "asyncssh>=2.14.0",
  "asyncpg>=0.29.0",
  "cryptography>=42.0.0",
  "fastapi>=0.111.0",
  "pydantic-settings>=2.2.0",
  "pyjwt>=2.8.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
redis = [
  "redis>=5.0.0"
]
dev = [
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "S"]
ignore = [
  "S101",  # asserts are how the tests are written
  "B008",  # FastAPI dependencies are function calls in defaults by design
  "S105",  # flags field names like secret_key / token_type, not real secrets
  "UP042",  # str+Enum is deliberate: SQLAlchemy stores the string values
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106", "S108", "E501"]
"alembic/*" = ["E501", "S608"]  # migration SQL is composed from module constants, not input
"app/core/config.py" = ["S104"]  # the string "0.0.0.0" appears in a validation blocklist

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
